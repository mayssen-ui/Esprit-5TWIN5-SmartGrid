# Apache Jena Fuseki (optionnel) : à utiliser avec SG_BACKEND=fuseki dans le fichier .env
#   docker compose up -d
#   Interface d'administration : http://localhost:3030  (utilisateur « admin », mot de passe ci-dessous)
services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: smartgrid-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin123
      FUSEKI_DATASET_1: smartgrid       # crée le jeu de données /smartgrid (stockage TDB2 persistant)
      JVM_ARGS: "-Xmx1g"
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
